<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Gallery
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Gallery</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-content>
    <ion-grid>
      <ion-row>
        <ion-col size="6" *ngFor="let item of galleryItems">
          <div class="gallery-item" (click)="showActionSheet(item)">
            <ion-img [src]="getThumbnail(item)"></ion-img>

            <div *ngIf="item.type === 'video'" class="video-badge">
              <ion-icon name="play-circle"></ion-icon>
              <span>{{ formatDuration(item.video?.duration) }}</span>
            </div>
          </div>
        </ion-col>
      </ion-row>
    </ion-grid>
  </ion-content>
</ion-content>
