<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Cloud Uploads / Settings
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Settings</ion-title>
    </ion-toolbar>
  </ion-header>

<ion-content class="ion-padding">

  <ion-grid>
    <ion-row>
      <ion-col></ion-col>

        <ion-col size="10">

        <ion-card>
          <ion-card-header>
            <ion-card-title>FTP Configuration</ion-card-title>
            <ion-card-subtitle>Allow the upload of your photos to our remote server for storage.</ion-card-subtitle>
          </ion-card-header>

          <ion-card-content>
              <ion-list>
          <ion-item>
            <ion-toggle>Allow upload Sync</ion-toggle>
          </ion-item>
          <ion-item>
            <ion-toggle>Full Quality Uploads</ion-toggle>
          </ion-item>
          <ion-item>
            <ion-toggle>Confirm when complete</ion-toggle>
          </ion-item>
        </ion-list>
          </ion-card-content>
        </ion-card>

        </ion-col>

    <ion-col></ion-col>
  </ion-row>
</ion-grid>

</ion-content>

<ion-footer>
  <ion-toolbar>
    <ion-title> JanSight v1.04 </ion-title>
  </ion-toolbar>
</ion-footer>
