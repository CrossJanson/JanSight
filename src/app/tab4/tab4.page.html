<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Synchronize Gallery Data
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Synchronize Gallery Data</ion-title>
    </ion-toolbar>
  </ion-header>

<ion-content class="ion-padding">

  <ion-grid>
    <ion-row>
      <ion-col></ion-col>

        <ion-col size="10">

        <ion-card>
          <ion-card-header>
            <ion-card-title>Upload Method</ion-card-title>
            <ion-card-subtitle>

              <ion-list>
              <ion-item>
                <ion-label>For bandwith considerations, you may choose your upload method option.</ion-label>
              </ion-item>
              <ion-item>
                <ion-icon aria-hidden="true" name="wifi" slot="start"></ion-icon>
                <ion-label>Wi-Fi</ion-label>
              </ion-item>
              <ion-item>
                <ion-icon aria-hidden="true" name="call" slot="start"></ion-icon>
                <ion-label>Cellular</ion-label>
              </ion-item>
            </ion-list>
              
            </ion-card-subtitle>
          </ion-card-header>

          <ion-card-content>

          </ion-card-content>
        </ion-card>

        </ion-col>

    <ion-col></ion-col>
  </ion-row>
</ion-grid>

</ion-content>

<ion-footer>
  <ion-toolbar>
    <ion-title> JanSight v1.04 </ion-title>
  </ion-toolbar>
</ion-footer>
