<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Settings
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Synchronize Gallery Data</ion-title>
    </ion-toolbar>
  </ion-header>

<ion-content class="ion-padding">

  <ion-grid>
    <ion-row>
      <ion-col></ion-col>

        <ion-col size="12">

        <ion-card>
          <ion-card-header>
            <ion-card-title>Orientation Lock</ion-card-title>
            <ion-card-subtitle>Lock current state of portrait or landscape</ion-card-subtitle>
          </ion-card-header>

          <ion-card-content>
              <ion-list>
          <ion-item>
            <ion-icon aria-hidden="true" name="image" slot="start"></ion-icon>
            <ion-toggle>Lock</ion-toggle>
          </ion-item>
        </ion-list>
          </ion-card-content>
        </ion-card>

        </ion-col>

    <ion-col></ion-col>
  </ion-row>
</ion-grid>

</ion-content>
